# Contributor License Agreement check.
# The action reads only PR metadata and comments; it never checks out or runs
# pull request code, which is what makes pull_request_target safe here.
# Signatures are committed to the cla-signatures branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/afterdarksys/blunix/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: straticus1,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before we can merge it, please read the
            [Blunix Contributor License Agreement](https://github.com/afterdarksys/blunix/blob/main/CLA.md)
            and sign it by commenting below with the exact sentence that follows.
            Companies can email licensing@blunix.io for an entity agreement instead.
