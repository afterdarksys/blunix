name: verify
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/api/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      - run: npm ci
      - run: npm test
      - run: npm ci && npm run typecheck && npm test
        working-directory: platform/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: cmp site/css/site.css portal/css/site.css
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: image/run-unit-tests.sh
      - run: image/test-personal-provision.sh
